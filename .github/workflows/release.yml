name: Release Obsidian plugin

# Push a tag named exactly after `manifest.json`'s version (no leading `v`) and this
# publishes a release carrying the three assets Obsidian expects. `release_to_public.sh`
# is the supported way to create that tag.
on:
    push:
        tags:
            - '*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - run: npm ci

            # Obsidian installs the version recorded in manifest.json, so a tag that
            # disagrees with it would publish assets nobody can install. Fail early.
            - name: Verify tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$manifest_version" ]; then
                    echo "tag=[${tag}] does not match manifest.json version=[${manifest_version}]" >&2
                    exit 1
                  fi

            - run: npm run lint

            - name: Build plugin
              run: npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: main.js

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    main.js manifest.json styles.css
